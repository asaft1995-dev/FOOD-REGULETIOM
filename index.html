<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ComplyFlow - עוזר רגולציה חכם</title>

  <!-- Fonts (Idea #1: Better Hebrew typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Dialogflow Messenger -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --text: #111827;
      --muted: #6b7280;
      --brand: #1a73e8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.10);
      --radius: 18px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Heebo", "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* --- Background (Idea #2: Cleaner glass + gradient layers) --- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;

      /* Make sure back_img.jpeg exists next to this HTML file */
      background-image: url('back_img.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      filter: blur(6px) saturate(1.15) contrast(1.05);
      opacity: 0.92;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1200px 600px at 80% 10%, rgba(26, 115, 232, 0.18), transparent 55%),
        radial-gradient(900px 500px at 10% 80%, rgba(17, 24, 39, 0.18), transparent 60%),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.35));
      z-index: -1;
    }

    /* --- Header --- */
    .app-header {
      height: 92px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 16px;

      background: var(--glass-strong);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow: var(--shadow-soft);
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      position: relative;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 64px;
      width: auto;
    }

    .header-text {
      margin-right: auto;
      line-height: 1.1;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .header-sub {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 3px;
    }

    /* --- Chat Container (glass card) --- */
    .chat-container {
      flex: 1;
      max-width: 1040px;
      width: calc(100% - 32px);
      margin: 18px auto 22px;

      border-radius: var(--radius);
      overflow: hidden;

      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.35);

      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Dialogflow Messenger theme vars */
    df-messenger {
      z-index: 1;
      --df-messenger-chat-window-height: 100%;
      --df-messenger-chat-window-width: 100%;

      --df-messenger-chat-background: rgba(255, 255, 255, 0.30);
      --df-messenger-message-user-background: rgba(26, 115, 232, 0.10);
      --df-messenger-message-user-font-color: #0b1220;
      --df-messenger-message-bot-background: rgba(255, 255, 255, 0.82);

      --df-messenger-send-icon: var(--brand);
      --df-messenger-button-titlebar-color: var(--brand);

      --df-messenger-input-box-background: rgba(255, 255, 255, 0.92);
      --df-messenger-input-border: 1px solid rgba(17, 24, 39, 0.10);
      --df-messenger-input-font-color: #0b1220;
      --df-messenger-input-placeholder-font-color: rgba(17, 24, 39, 0.45);
    }

    /* Keep DF chat direction as you had */
    df-messenger-chat {
      direction: ltr !important;
    }

    /* Hide the floating bubble */
    df-messenger-chat-bubble {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 720px) {
      .app-header {
        height: 84px;
        padding: 0 16px;
      }

      .logo-img {
        height: 54px;
      }

      .header-title {
        font-size: 1.18rem;
      }

      .chat-container {
        width: calc(100% - 18px);
        margin: 12px auto 14px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="logo-container">
      <img src="logo.png" alt="ComplyFlow Logo" class="logo-img" />
    </div>

    <div class="header-text">
      <div class="header-title">הדרך המהירה לעסק שלך</div>
      <div class="header-sub">ComplyFlow · עוזר רגולציה חכם</div>
    </div>
  </header>

  <main class="chat-container">
    <df-messenger location="us-central1" project-id="asafturjeman" agent-id="28b9247b-716c-4fac-9d86-22791f29f510"
      language-code="he" expand="true">
      <df-messenger-chat chat-title="ComplyFlow Assistant"></df-messenger-chat>
    </df-messenger>
  </main>
</body>

</html>
